<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presença nas aulas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F6; --card:#fff; --ink:#14213D; --ink2:#4A5675; --line:#D5DBE8;
  --hl:#FFD60A; --ok:#0E7C57; --warn:#9A6200; --bad:#C8102E;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.pass,.card{background:var(--card);border-radius:20px;box-shadow:0 1px 0 var(--line),0 12px 28px -18px rgba(20,33,61,.45);margin-bottom:16px;overflow:hidden;position:relative}
.card{padding:22px 20px}
.pass::before{content:"";position:absolute;top:10px;left:50%;width:54px;height:10px;margin-left:-27px;border-radius:6px;background:var(--bg);box-shadow:inset 0 1px 2px rgba(20,33,61,.25);z-index:2}
.band{background:var(--ink);color:#fff;display:flex;justify-content:space-between;gap:12px;padding:34px 20px 12px;font-size:14px;font-weight:500}
.who{padding:18px 20px 6px}
.who .hello{color:var(--ink2);font-size:14px}
.who h1{font-weight:800;font-stretch:112%;font-size:clamp(28px,8vw,38px);letter-spacing:-.01em;overflow-wrap:anywhere;margin-top:2px}
.sec{padding:16px 20px 20px;border-top:1px dashed var(--line);margin-top:14px}
.sec h2{font-size:18px;font-weight:700;font-stretch:105%;margin-bottom:4px}
.muted{color:var(--ink2);font-size:14px}

label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select{width:100%;height:50px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--hl)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}

.btn{display:block;width:100%;height:54px;margin-top:18px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:17px;cursor:pointer;box-shadow:4px 4px 0 var(--hl);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--hl)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none;height:46px;margin-top:10px;font-size:15px}
.btn.small{height:50px;width:auto;margin:0;padding:0 16px;font-size:15px;box-shadow:none}
.link{background:none;border:0;padding:6px 0;color:var(--ink2);text-decoration:underline;cursor:pointer;font-size:14px}
.foot{text-align:center;margin-top:8px}

.aula{background:#FFF9D6;border:1.5px solid var(--hl);border-radius:14px;padding:14px 16px;margin:14px 20px 0}
.aula strong{font-family:var(--display);font-size:17px}
.msg{border-radius:14px;padding:14px 16px;margin:14px 20px 0;font-size:15px}
.msg.warn{background:#FFF3D6;color:#5C3B00}
.msg.bad{background:#FDE6EA;color:#7D0A1E}
.msg.info{background:#E8EEFA}
.stamp{margin:14px 20px 0;display:inline-block;border:3px solid var(--ok);color:var(--ok);border-radius:10px;padding:8px 14px;font-family:var(--display);font-weight:800;font-size:20px;transform:rotate(-3deg);animation:stamp .38s cubic-bezier(.2,1.5,.4,1)}
@keyframes stamp{from{transform:rotate(-12deg) scale(1.9);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}

.disc{margin-top:18px}
.disc:first-of-type{margin-top:10px}
.disc h3{font-size:16px;font-weight:700;font-stretch:104%}
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 8px}
.cell{width:20px;height:26px;border-radius:4px}
.cell.p{background:var(--ink)}
.cell.f{border:1.5px solid var(--bad);background:repeating-linear-gradient(135deg,var(--bad) 0 3px,#fff 3px 6px)}
.cell.n{border:1.5px dashed var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.nums{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.nums b{font-family:var(--display);font-size:26px;font-weight:800}
.chip{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600}
.chip.ok{background:#DDF3EA;color:var(--ok)}
.chip.warn{background:#FFEBC2;color:var(--warn)}
.chip.bad{background:#FDE0E5;color:var(--bad)}

.qrbox{background:#fff;padding:12px;border-radius:16px;border:1.5px solid var(--ink);margin-top:14px}
.qrbox svg{display:block;width:100%;height:auto}
.qrbox.full{display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;border-radius:0;padding:24px;gap:16px}
.qrbox.full svg{max-width:min(80vh,80vw)}
.qrcap{text-align:center;font-weight:600;margin-top:10px}
details{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600}
pre{background:var(--ink);color:#E6EAF5;border-radius:12px;padding:14px;font-size:12.5px;line-height:1.45;overflow-x:auto;white-space:pre}
ol{padding-left:20px;margin:10px 0}
li{margin:4px 0;font-size:14px}
.err{color:var(--bad);font-size:14px;margin-top:8px}

.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:disabled{opacity:.45;cursor:not-allowed}
.card.narrow{max-width:480px;margin-left:auto;margin-right:auto}
#app.wide{max-width:920px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--bg);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1}
.kpi span{font-size:13px;color:var(--ink2)}
.bars{margin:8px 0 4px}
.bar{display:grid;grid-template-columns:74px 1fr 34px;gap:10px;align-items:center;font-size:14px;margin:5px 0}
.bar i{display:block;height:16px;border-radius:4px;background:var(--ink);min-width:2px}
.tw{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:left;font-weight:600;color:var(--ink2);padding:8px 10px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.dtop{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
@media (max-width:560px){.dtop{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<script>
(function(){
"use strict";

/* ---------- utilidades ---------- */
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function enc(o){var b=new TextEncoder().encode(JSON.stringify(o)),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(s){try{s=s.replace(/-/g,'+').replace(/_/g,'/');var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);var o=JSON.parse(new TextDecoder().decode(u));return (o&&o.v===1&&o.d&&o.a)?o:null}catch(e){return null}}
function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('d'+Date.now())}
function hora(ts){return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}

/* ---------- estado ---------- */
var DEF=[
  {id:'planejamento-gestao-estrategica',nome:'Planejamento e Gestão Estratégica',total:16,aula:1},
  {id:'gestao-planejamento-midia',nome:'Gestão e Planejamento de Mídia',total:16,aula:1}
];
var S=load('presenca.aluno')||{perfil:null,disc:{},pend:[]};
var P=load('presenca.prof')||{discs:DEF,sel:DEF[0].id,base:'',endpoint:'',chave:'',validade:40};
var params=new URLSearchParams(location.search);
var raw=params.get('c');
var sess=raw?dec(raw):null;
var mode=location.hash==='#professor'?'prof':'aluno';
var notice=null, gen=null, full=false, formErr='', loginErr='';
var genErr='';var AUTH=false;try{AUTH=sessionStorage.getItem('presenca.auth')==='1'}catch(e){}
var DATA=null, dash={loading:false,err:'',disc:'',q:'',at:0};
var HASH='262c0e49bb743baff35a2e0fd9e0d14b0ab74a50799d555749bd66fc760b4680';
function sha256(s){
  var b=new TextEncoder().encode(s),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n),i,j,p=2,c=0,K=[],H=[];
  m.set(b);m[l]=128;var dv=new DataView(m.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));

    for(i=0;i<16;i++)w[i]=dv.getUint32(off+i*4);
    for(i=16;i<64;i++){var a=w[i-15],g=w[i-2],s0=(a>>>7|a<<25)^(a>>>18|a<<14)^(a>>>3),s1=(g>>>17|g<<15)^(g>>>19|g<<13)^(g>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    var h=H.slice();
    for(i=0;i<64;i++){
      var e=h[4],S1=(e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7),ch=(e&h[5])^(~e&h[6]),t1=(h[7]+S1+ch+K[i]+w[i])|0;
      var A=h[0],S0=(A>>>2|A<<30)^(A>>>13|A<<19)^(A>>>22|A<<10),mj=(A&h[1])^(A&h[2])^(h[1]&h[2]),t2=(S0+mj)|0;
      h=[(t1+t2)|0,h[0],h[1],h[2],(h[3]+t1)|0,h[4],h[5],h[6]];

  return H.map(function(x){return ('00000000'+(x>>>0).toString(16)).slice(-8)}).join('');
}
function loginOk(u,s){return sha256('presenca-qr|'+u.trim().toLowerCase()+'|'+s)===HASH}

function saveS(){save('presenca.aluno',S)}
function saveP(){save('presenca.prof',P)}
function ensure(sx){
  var d=S.disc[sx.d]||(S.disc[sx.d]={nome:sx.n,total:sx.o||16,seen:0,pres:[]});
  d.nome=sx.n; if(sx.o)d.total=sx.o;
  d.seen=Math.max(d.seen,sx.a);
  return d;
}
function expired(){return !!(sess&&sess.x&&Date.now()>sess.x)}
function jaRegistrou(){return !!(sess&&S.disc[sess.d]&&S.disc[sess.d].pres.indexOf(sess.a)>-1)}

if(sess&&S.perfil){ensure(sess);saveS()}
flush();

/* ---------- envio para a planilha (opcional) ---------- */
function flush(){
  if(!S.pend||!S.pend.length)return;
  var rest=[],jobs=S.pend.map(function(p){
    return fetch(p.url,{method:'POST',mode:'no-cors',body:JSON.stringify(p.body)}).catch(function(){rest.push(p)});
  });
  Promise.all(jobs).then(function(){S.pend=rest;saveS()});
}
function enviar(sx){
  if(!sx.e)return;
  S.pend.push({url:sx.e,body:{nome:S.perfil.nome,semestre:S.perfil.semestre,curso:S.perfil.curso,disciplina:sx.n,aula:sx.a,data:new Date().toLocaleDateString('pt-BR'),hora:hora(Date.now())}});
  saveS();flush();
}
function checkin(){
  var d=ensure(sess);
  if(d.pres.indexOf(sess.a)>-1){notice={t:'info',m:'Sua presença nesta aula já estava registrada.'};return}
  d.pres.push(sess.a);saveS();enviar(sess);
  notice={t:'ok'};
}

/* ---------- aluno ---------- */
function semOpts(sel){var h='<option value="">Selecione</option>';for(var i=1;i<=8;i++)h+='<option value="'+i+'"'+(String(sel)===String(i)?' selected':'')+'>'+i+'º semestre</option>';return h}
function cursoOpts(sel){return '<option value="">Selecione</option>'+['Jornalismo','Publicidade'].map(function(c){return '<option'+(c===sel?' selected':'')+'>'+c+'</option>'}).join('')}

function formHTML(){
  var live=sess&&!expired();
  var t=live?'Registrar presença':'Seus dados';
  var sub=live?esc(sess.n)+' · aula '+sess.a:'Preencha uma vez. Nas próximas aulas o sistema reconhece você.';
  return '<section class="card"><h1 style="font-size:28px;font-weight:800;font-stretch:112%">'+t+'</h1>'+
   '<p class="muted" style="margin-top:6px">'+sub+'</p>'+
   (sess&&expired()?'<div class="msg bad" style="margin:14px 0 0">O QR code desta aula expirou. Você pode salvar seus dados, mas a presença não será registrada.</div>':'')+
   '<form id="f-aluno" novalidate>'+
   '<label for="nome">Nome completo</label><input id="nome" name="nome" autocomplete="name" maxlength="80" required>'+
   '<div class="row"><div><label for="sem">Semestre</label><select id="sem" required>'+semOpts('')+'</select></div>'+
   '<div><label for="curso">Curso</label><select id="curso" required>'+cursoOpts('')+'</select></div></div>'+
   (formErr?'<p class="err" role="alert">'+esc(formErr)+'</p>':'')+
   '<button class="btn" type="submit">'+(live?'Registrar presença':'Salvar meus dados')+'</button></form></section>';
}

function regua(id,d){
  var tot=Math.max(d.total,d.seen),lim=Math.floor(d.total*0.25),pres=0,fal=0,cells='';
  for(var i=1;i<=tot;i++){
    var c='n',lab='aula '+i+', ainda não aconteceu';
    if(d.pres.indexOf(i)>-1){c='p';pres++;lab='aula '+i+', presente'}
    else if(i<=d.seen){c='f';fal++;lab='aula '+i+', falta'}
    cells+='<span class="cell '+c+'" role="img" aria-label="'+lab+'"></span>';
  }
  var st=fal>lim?['bad','Acima do limite de faltas']:fal===lim?['warn','No limite: mais uma falta reprova']:['ok','Dentro do limite'];
  return '<div class="disc"><h3>'+esc(d.nome)+'</h3><div class="cells">'+cells+'</div>'+
   '<div class="nums"><span><b>'+pres+'</b> presenças</span><span><b>'+fal+'</b> faltas</span><span class="muted">limite: '+lim+' faltas (25% de '+d.total+' aulas)</span></div>'+
   '<span class="chip '+st[0]+'">'+st[1]+'</span>'+
   '<div class="legend" style="margin-top:10px"><span><i style="background:var(--ink)"></i>Presente</span><span><i style="background:repeating-linear-gradient(135deg,var(--bad) 0 2px,#fff 2px 4px);border:1px solid var(--bad)"></i>Falta</span><span><i style="border:1.5px dashed var(--line)"></i>Ainda não aconteceu</span></div></div>';
}

function alunoHTML(){
  var out='';
  if(raw&&!sess)out+='<div class="msg bad" style="margin:0 0 16px">Este QR code não é válido. Escaneie de novo o código mostrado pelo professor.</div>';
  if(!S.perfil)return out+formHTML()+foot();
  var p=S.perfil,live=sess&&!expired(),blk='';
  if(notice&&notice.t==='ok')blk='<div class="stamp" role="status">Presença registrada</div><p class="muted" style="margin:8px 20px 0">'+esc(sess.n)+' · aula '+sess.a+(sess.e&&S.pend.length?' · envio pendente, tentaremos de novo ao abrir a página':'')+'</p>';
  else if(notice&&notice.t==='info')blk='<div class="msg info" role="status">'+esc(notice.m)+'</div>';
  else if(sess&&expired())blk='<div class="msg bad" role="alert">O QR code desta aula expirou. Peça ao professor para reabrir a presença.</div>';
  else if(live&&jaRegistrou())blk='<div class="msg info">Sua presença na aula '+sess.a+' de '+esc(sess.n)+' já está registrada.</div>';
  else if(live)blk='<div class="aula"><strong>Aula '+sess.a+'</strong><div class="muted">'+esc(sess.n)+'</div><button class="btn" style="margin-top:12px" data-act="checkin">Confirmar presença</button></div>';
  var ids=Object.keys(S.disc),reg='';
  if(ids.length)reg=ids.map(function(i){return regua(i,S.disc[i])}).join('');
  else reg='<p class="muted">Sua régua de presença aparece aqui depois do primeiro check-in.</p>';
  return out+'<section class="pass"><div class="band"><span>'+esc(p.semestre)+'º semestre</span><span>'+esc(p.curso)+'</span></div>'+
   '<div class="who"><p class="hello">Olá,</p><h1>'+esc(p.nome)+'</h1></div>'+blk+
   '<div class="sec"><h2>Minhas faltas</h2>'+reg+'</div></section>'+
   '<div class="foot"><button class="link" data-act="reset">Não sou eu</button></div>'+foot();
}
function foot(){return '<div class="foot"><button class="link" data-act="prof">Área do professor</button></div>'}

/* ---------- professor ---------- */
var SCRIPT='var CHAVE = "troque-por-uma-chave-sua";\n\nfunction doPost(e) {\n  var d = JSON.parse(e.postData.contents);\n  var sh = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];\n  sh.appendRow([new Date(), d.nome, d.semestre, d.curso,\n                d.disciplina, d.aula, d.data, d.hora]);\n  return ContentService.createTextOutput("ok");\n}\n\nfunction doGet(e) {\n  var out;\n  if (!e.parameter.chave || e.parameter.chave !== CHAVE) {\n    out = {ok: false};\n  } else {\n    var v = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0].getDataRange().getValues();\n    out = {ok: true, rows: v.slice(1).map(function (r) {\n      return {nome: r[1], semestre: r[2], curso: r[3],\n              disciplina: r[4], aula: r[5], data: r[6], hora: r[7]};\n    })};\n  }\n  return ContentService.createTextOutput(JSON.stringify(out))\n    .setMimeType(ContentService.MimeType.JSON);\n}';
function curDisc(){return P.discs.filter(function(d){return d.id===P.sel})[0]||P.discs[0]}
function baseUrl(){return P.base||(location.href.split('?')[0].split('#')[0])}

function loginHTML(){
  return '<section class="card narrow"><h1 style="font-size:28px;font-weight:800;font-stretch:112%">Área do professor</h1><p class="muted" style="margin-top:6px">Entre para abrir a presença e ver o painel.</p>'+
   '<form id="f-login" novalidate><label for="u">Usuário</label><input id="u" autocomplete="username" autocapitalize="none" spellcheck="false">'+
   '<label for="s">Senha</label><input id="s" type="password" autocomplete="current-password">'+
   (loginErr?'<p class="err" role="alert">'+esc(loginErr)+'</p>':'')+
   '<button class="btn" type="submit">Entrar</button></form></section><div class="foot"><button class="link" data-act="aluno">Voltar para a área do aluno</button></div>';
}

function profHTML(){
  if(!AUTH)return loginHTML();
  var d=curDisc(),h='';
  h+='<section class="card narrow"><h1 style="font-size:28px;font-weight:800;font-stretch:112%">Abrir presença</h1>'+
   '<p class="muted" style="margin-top:6px">Gere o QR code da aula e projete na tela. Os alunos escaneiam com a câmera do celular.</p>';
  if(location.protocol==='file:'&&!P.base)h+='<div class="msg warn" style="margin:14px 0 0">Esta página está aberta como arquivo local. Publique o HTML em um endereço (por exemplo GitHub Pages ou Netlify) e informe o link em Configurações, senão o celular dos alunos não consegue abrir.</div>';
  h+='<label for="disc">Disciplina</label><select id="disc" data-f="sel">'+P.discs.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===d.id?' selected':'')+'>'+esc(x.nome)+'</option>'}).join('')+'</select>'+
   '<div class="row3"><div><label for="aula">Número da aula</label><input id="aula" type="number" min="1" max="99" inputmode="numeric" value="'+d.aula+'" data-f="aula"></div>'+
   '<button class="btn small ghost" type="button" data-act="next" style="margin-bottom:0">Próxima aula</button></div>'+
   '<label for="tot">Total de aulas no semestre</label><input id="tot" type="number" min="4" max="60" inputmode="numeric" value="'+d.total+'" data-f="total">'+
   '<p class="muted" style="margin-top:10px">O QR code expira hoje às 22h, não importa a hora em que for gerado.</p>'+
   '<button class="btn" data-act="gerar">Gerar QR code da aula '+d.aula+'</button>'+(genErr?'<p class="err" role="alert">'+esc(genErr)+'</p>':'');
  if(gen){
    h+='<div class="qrbox" id="qrbox">'+gen.svg+'</div><p class="qrcap">Aula '+gen.aula+' · '+esc(gen.nome)+'<br><span class="muted">Expira às 22h</span></p>'+
     '<div class="row"><button class="btn ghost" data-act="full">Tela cheia</button><button class="btn ghost" data-act="copy">Copiar link</button></div>';
  }
  h+='<details><summary>Configurações</summary>'+
   '<label for="base">Link desta página (o que o QR abre)</label><input id="base" data-f="base" value="'+esc(P.base)+'" placeholder="'+esc(baseUrl())+'">'+
   '<label for="end">Endereço do Apps Script (opcional)</label><input id="end" data-f="endpoint" value="'+esc(P.endpoint)+'" placeholder="https://script.google.com/macros/s/.../exec">'+
   '<label for="chv">Chave de leitura da planilha</label><input id="chv" type="password" autocomplete="off" data-f="chave" value="'+esc(P.chave)+'" placeholder="a mesma chave do Apps Script">'+
   '<label for="nd">Adicionar disciplina</label><div class="row3"><input id="nd" placeholder="Nome da disciplina"><button class="btn small ghost" type="button" data-act="add">Adicionar</button></div>'+
   '<label>Excluir disciplina</label><button class="btn ghost danger" type="button" data-act="del"'+(P.discs.length<2?' disabled':'')+'>Excluir '+esc(d.nome)+'</button>'+
   '<p class="muted" style="margin-top:6px">'+(P.discs.length<2?'Mantenha ao menos uma disciplina na lista.':'Remove só da lista do gerador. Os registros que já estão na planilha continuam lá.')+'</p>'+
   '</details>'+
   '<details><summary>Receber os check-ins numa planilha do Google</summary>'+
   '<ol><li>Crie uma planilha e, na primeira linha, escreva: Registro, Nome, Semestre, Curso, Disciplina, Aula, Data, Hora.</li>'+
   '<li>Vá em Extensões, Apps Script, e cole o código abaixo.</li>'+
   '<li>Clique em Implantar, Nova implantação, App da Web. Em "Quem pode acessar", escolha Qualquer pessoa.</li>'+
   '<li>No código, troque o texto da primeira linha (CHAVE) por uma chave só sua. Ela protege os dados dos alunos: só quem tem a chave consegue ler a planilha pelo painel.</li>'+
   '<li>Copie o endereço gerado e cole em Configurações, junto com a mesma chave. Gere o QR de novo.</li>'+
   '<li>Se você já tinha uma implantação anterior, use Gerenciar implantações, edite e publique uma nova versão, senão o painel não consegue ler.</li></ol>'+
   '<pre id="code">'+esc(SCRIPT)+'</pre><button class="btn ghost" data-act="copycode">Copiar código</button></details></section>'+dashHTML()+
   '<div class="foot"><button class="link" data-act="logout">Sair</button> &nbsp; <button class="link" data-act="aluno">Voltar para a área do aluno</button></div>';
  return h;
}


/* ---------- painel ---------- */
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim()}
function stats(){
  var out={};
  (DATA||[]).forEach(function(r){
    var dn=String(r.disciplina==null?'':r.disciplina).trim(),a=parseInt(r.aula,10);
    if(!dn||!a||!r.nome)return;
    var D=out[dn]||(out[dn]={nome:dn,aulas:{},alunos:{}});
    var k=norm(r.nome)+'|'+r.semestre+'|'+norm(r.curso);
    var A=D.alunos[k]||(D.alunos[k]={nome:String(r.nome).trim(),semestre:r.semestre,curso:String(r.curso||'').trim(),pres:{}});
    A.pres[a]=1;(D.aulas[a]=D.aulas[a]||{})[k]=1;
  });
  return out;
}
function totalDe(nome){var m=P.discs.filter(function(x){return x.nome===nome})[0];return m?m.total:16}
function dashBody(D){
  var aulas=Object.keys(D.aulas).map(Number).sort(function(a,b){return a-b}),nA=aulas.length;
  var alunos=Object.keys(D.alunos).map(function(k){return D.alunos[k]}),tot=totalDe(D.nome),lim=Math.floor(tot*0.25);
  var checkins=0,max=0;aulas.forEach(function(a){var c=Object.keys(D.aulas[a]).length;checkins+=c;if(c>max)max=c});
  var jor=alunos.filter(function(a){return norm(a.curso)==='jornalismo'}).length,pub=alunos.filter(function(a){return norm(a.curso)==='publicidade'}).length;
  var h='<div class="kpis"><div class="kpi"><b>'+alunos.length+'</b><span>alunos com registro</span></div>'+
   '<div class="kpi"><b>'+nA+'</b><span>aulas com registro</span></div>'+
   '<div class="kpi"><b>'+(nA?Math.round(checkins/nA):0)+'</b><span>presentes por aula, em média</span></div>'+
   '<div class="kpi"><b>'+jor+' / '+pub+'</b><span>Jornalismo / Publicidade</span></div></div>';
  h+='<h2 style="font-size:16px;margin-top:6px">Presença por aula</h2><div class="bars">'+aulas.map(function(a){var c=Object.keys(D.aulas[a]).length;return '<div class="bar"><span>Aula '+a+'</span><i style="width:'+(max?Math.round(c/max*100):0)+'%"></i><b>'+c+'</b></div>'}).join('')+'</div>';
  h+='<h2 style="font-size:16px;margin-top:18px">Alunos</h2><label for="busca" style="margin-top:8px">Buscar por nome</label><input id="busca" data-dash="q" value="'+esc(dash.q)+'" autocomplete="off"><div class="tw" id="dash-tbl">'+tabela(D,nA,tot,lim)+'</div>';
  return h;
}
function tabela(D,nA,tot,lim){
  var q=norm(dash.q);
  var rows=Object.keys(D.alunos).map(function(k){var a=D.alunos[k],p=Object.keys(a.pres).length;return {a:a,p:p,f:Math.max(0,nA-p)}})
    .filter(function(r){return !q||norm(r.a.nome).indexOf(q)>-1})
    .sort(function(x,y){return y.f-x.f||x.a.nome.localeCompare(y.a.nome,'pt-BR')});
  if(!rows.length)return '<p class="muted" style="margin-top:8px">Nenhum aluno encontrado.</p>';
  return '<table><thead><tr><th>Aluno</th><th>Semestre e curso</th><th class="n">Presenças</th><th class="n">Faltas</th><th class="n">% de faltas</th><th>Situação</th></tr></thead><tbody>'+
   rows.map(function(r){var pc=Math.round(r.f/tot*1000)/10,st=r.f>lim?['bad','Acima do limite']:r.f===lim?['warn','No limite']:['ok','Dentro do limite'];
     return '<tr><td>'+esc(r.a.nome)+'</td><td>'+esc(r.a.semestre)+'º · '+esc(r.a.curso)+'</td><td class="n">'+r.p+'</td><td class="n">'+r.f+'</td><td class="n">'+String(pc).replace('.',',')+'%</td><td><span class="chip '+st[0]+'" style="margin:0">'+st[1]+'</span></td></tr>'}).join('')+
   '</tbody></table><p class="muted" style="margin-top:8px">Faltas = aulas com registro na turma menos as presenças do aluno. % calculada sobre '+tot+' aulas; limite de '+lim+' faltas.</p>';
}
function dashHTML(){
  var h='<section class="card" id="dash"><div class="dtop"><div><h1 style="font-size:24px;font-weight:800;font-stretch:112%">Painel de presenças</h1>'+
   '<p class="muted" style="margin-top:4px">'+(dash.at?'Atualizado às '+hora(dash.at):'Dados da planilha do Google')+'</p></div><span></span>'+
   '<button class="btn small" type="button" data-act="refresh"'+(dash.loading?' disabled':'')+'>'+(dash.loading?'Carregando…':'Atualizar dados')+'</button></div>';
  if(dash.err)h+='<div class="msg bad" role="alert" style="margin:14px 0 0">'+esc(dash.err)+'</div>';
  if(!DATA){
    if(!dash.err&&!dash.loading)h+='<p class="muted" style="margin-top:14px">'+((P.endpoint&&P.chave)?'Toque em "Atualizar dados" para carregar a planilha.':'Informe o endereço do Apps Script e a chave de leitura em Configurações para ver os dados.')+'</p>';
    return h+'</section>';
  }
  var S2=stats(),names=Object.keys(S2);
  if(!names.length)return h+'<p class="muted" style="margin-top:14px">A planilha ainda não tem registros.</p></section>';
  if(!S2[dash.disc])dash.disc=names[0];
  h+='<label for="dsel" style="margin-top:14px">Disciplina</label><select id="dsel" data-dash="disc">'+names.map(function(n){return '<option'+(n===dash.disc?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select>';
  return h+dashBody(S2[dash.disc])+'</section>';
}
function loadDash(){
  if(!P.endpoint||!P.chave){dash.err='Informe o endereço do Apps Script e a chave de leitura em Configurações.';render();return}
  dash.loading=true;dash.err='';render();
  fetch(P.endpoint+(P.endpoint.indexOf('?')>-1?'&':'?')+'chave='+encodeURIComponent(P.chave))
   .then(function(r){return r.json()})
   .then(function(j){if(!j||!j.ok)throw new Error('chave');DATA=j.rows||[];dash.at=Date.now();dash.loading=false;render()})
   .catch(function(e){dash.loading=false;dash.err=(e&&e.message==='chave')?'Chave de leitura incorreta. Ela precisa ser igual à do Apps Script.':'Não foi possível ler a planilha. Confira o endereço, se a implantação permite acesso de qualquer pessoa e se publicou a nova versão do código.';render()});
}

function gerar(){
  var lim=new Date();lim.setHours(22,0,0,0);
  if(Date.now()>=lim.getTime()){genErr='Já passou das 22h. Um QR gerado agora expiraria na hora. Gere de novo amanhã.';gen=null;return}
  genErr='';
  var d=curDisc(),payload={v:1,d:d.id,n:d.nome,a:d.aula,x:lim.getTime(),o:d.total};
  if(P.endpoint)payload.e=P.endpoint.trim();
  var url=baseUrl()+'?c='+enc(payload);
  var q=qrcode(0,'M');q.addData(url);q.make();
  var n=q.getModuleCount(),m=4,p='';
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))p+='M'+(c+m)+' '+(r+m)+'h1v1h-1z';
  var s=n+m*2;
  gen={url:url,aula:d.aula,nome:d.nome,until:payload.x,
   svg:'<svg viewBox="0 0 '+s+' '+s+'" shape-rendering="crispEdges" role="img" aria-label="QR code da aula '+d.aula+'"><rect width="'+s+'" height="'+s+'" fill="#fff"/><path d="'+p+'" fill="#14213D"/></svg>'};
  saveP();
}
function copiar(txt,btn,ok){
  function done(){var o=btn.textContent;btn.textContent=ok;setTimeout(function(){btn.textContent=o},1600)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){})}
  else{var t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){}t.remove()}
}

/* ---------- eventos ---------- */
document.addEventListener('submit',function(e){
  if(e.target.id==='f-login'){
    e.preventDefault();
    var u=document.getElementById('u').value,s=document.getElementById('s').value;
    if(loginOk(u,s)){AUTH=true;loginErr='';try{sessionStorage.setItem('presenca.auth','1')}catch(x){}render();if(P.endpoint&&P.chave)loadDash()}
    else{loginErr='Usuário ou senha incorretos.';render()}
    return;
  }
  if(e.target.id!=='f-aluno')return;
  e.preventDefault();
  var nome=document.getElementById('nome').value.trim(),sem=document.getElementById('sem').value,cur=document.getElementById('curso').value;
  if(nome.split(/\s+/).length<2||!sem||!cur){formErr='Informe nome e sobrenome, semestre e curso.';render();return}
  formErr='';S.perfil={nome:nome,semestre:sem,curso:cur};saveS();
  if(sess&&!expired())checkin();
  else if(sess){ensure(sess);saveS();notice=null}
  render();
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(a==='checkin'){checkin();render()}
  else if(a==='reset'){if(confirm('Apagar seus dados e histórico de faltas neste aparelho?')){S={perfil:null,disc:{},pend:[]};saveS();notice=null;render()}}
  else if(a==='logout'){AUTH=false;DATA=null;gen=null;try{sessionStorage.removeItem('presenca.auth')}catch(x){}render()}
  else if(a==='refresh'){loadDash()}
  else if(a==='prof'){mode='prof';location.hash='professor';render()}
  else if(a==='aluno'){mode='aluno';history.replaceState(null,'',location.pathname+location.search);render()}
  else if(a==='next'){curDisc().aula=Math.min(99,curDisc().aula+1);saveP();gen=null;render()}
  else if(a==='gerar'){gerar();render();if(!gen)return;var q=document.getElementById('qrbox');if(q&&q.scrollIntoView)q.scrollIntoView({block:'center'})}
  else if(a==='full'){var q2=document.getElementById('qrbox');if(q2&&q2.requestFullscreen){q2.classList.add('full');q2.insertAdjacentHTML('beforeend','<p class="qrcap">Aula '+gen.aula+' · '+esc(gen.nome)+'</p>');q2.requestFullscreen().catch(function(){});}}
  else if(a==='copy'){copiar(gen.url,b,'Link copiado')}
  else if(a==='copycode'){copiar(SCRIPT,b,'Código copiado')}
  else if(a==='del'){var dd=curDisc();if(P.discs.length<2)return;if(confirm('Excluir a disciplina "'+dd.nome+'" da lista? Os registros já enviados para a planilha não são apagados.')){P.discs=P.discs.filter(function(x){return x.id!==dd.id});P.sel=P.discs[0].id;saveP();gen=null;render()}}
  else if(a==='add'){var v=document.getElementById('nd').value.trim();if(v){P.discs.push({id:slug(v),nome:v,total:16,aula:1});P.sel=P.discs[P.discs.length-1].id;saveP();gen=null;render()}}
});
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement)render()});
document.addEventListener('input',function(e){
  var df=e.target.getAttribute&&e.target.getAttribute('data-dash');
  if(df==='q'){dash.q=e.target.value;var S3=stats(),Dd=S3[dash.disc],tb=document.getElementById('dash-tbl');if(Dd&&tb){var nA=Object.keys(Dd.aulas).length,tt=totalDe(Dd.nome);tb.innerHTML=tabela(Dd,nA,tt,Math.floor(tt*0.25))}return}
  var f=e.target.getAttribute&&e.target.getAttribute('data-f');if(!f)return;
  var v=e.target.value;
  if(f==='aula'){curDisc().aula=Math.max(1,Math.min(99,parseInt(v,10)||1));var gb=document.querySelector('[data-act=gerar]');if(gb)gb.textContent='Gerar QR code da aula '+curDisc().aula}
  else if(f==='total'){curDisc().total=Math.max(4,Math.min(60,parseInt(v,10)||16))}
  else if(f==='validade'){P.validade=Math.max(5,Math.min(240,parseInt(v,10)||40))}
  else if(f==='base'||f==='endpoint'||f==='chave'){P[f]=v.trim()}
  saveP();
});
document.addEventListener('change',function(e){
  if(e.target.getAttribute&&e.target.getAttribute('data-dash')==='disc'){dash.disc=e.target.value;dash.q='';render();return}
  if(e.target.getAttribute&&e.target.getAttribute('data-f')==='sel'){P.sel=e.target.value;saveP();gen=null;render()}
});

function render(){app.className=(mode==='prof'&&AUTH)?'wide':'';app.innerHTML=mode==='prof'?profHTML():alunoHTML()}
render();
})();
</script>
